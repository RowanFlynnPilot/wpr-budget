name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # data contracts + i18n parity (scripts/check-data.mjs) gate every deploy
      - run: npm run check
      - run: npm run build
        env:
          # Plausible analytics (src/analytics.js): off until these repo variables are set
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_SCRIPT_ID: ${{ vars.PLAUSIBLE_SCRIPT_ID }}
      # a real browser drives the built site the way a reader does (scripts/e2e.py):
      # bills that add up, the map, location, the assessment check, every view x language
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install playwright==1.60.0 && python -m playwright install --with-deps chromium
      - name: End-to-end checks
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4173/wpr-budget/ > /dev/null && break; sleep 1; done
          python scripts/e2e.py --base http://localhost:4173/wpr-budget/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
